<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, active)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Среднее арифметическое матрицы</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container py-4">
    <h3 class="mb-4">Среднее арифметическое матрицы</h3>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'random'} ? 'active'"
               th:href="@{/random}">Рандом</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'manual'} ? 'active'"
               th:href="@{/manual}">Заполнение</a>
        </li>
    </ul>

    <div class="border border-secondary-subtle rounded-bottom p-3" th:insert="${content}"></div>
</div>
</body>
</html>
